[workspace]
resolver = "3"
members = ["crates/anubis-crypto", "crates/anubis-cli"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Anubis Quantum Cipher"]
repository = "https://github.com/AnubisQuantumCipher/anubis"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
