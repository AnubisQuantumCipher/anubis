[package]
name = "anubis-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anubis-v4-core = { path = "../anubis-v4-core" }
base64 = "0.23.1"
bech32 = "0.12.0"
# `zeroize` makes the cipher wipe its key schedule on drop; without it the
# wrap and payload keys outlive the `Zeroizing` wrappers that own them.
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
hybrid-array = "0.4.14"
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
ml-kem = { version = "0.3.2", features = ["zeroize"] }
rand_core = "0.10.1"
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.0"

[lints]
workspace = true
